[profile.default]
src = 'src'
out = 'forge-artifacts'
optimizer = true
optimizer_runs = 999999
evm_version = 'cancun'
solc_version = '0.8.15'

remappings = [
  'forge-std/=lib/forge-std/src',
  'ds-test/=lib/forge-std/lib/ds-test/src',
  'interfaces/=interfaces',
]

[fuzz]
runs = 64

[fmt]
line_length = 120
multiline_func_header = 'all'
bracket_spacing = true
wrap_comments = true
